  <path d="M90 525h210l55-2 35-145 65 285 70-230 55 92h125l45-70 50 70h130l35-170 65 330 70-210 55 50h260" fill="none" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="320" cy="523" r="16" fill="#34D399"/><text class="tiny" x="320" y="569" text-anchor="middle">REACH</text><circle cx="455" cy="663" r="16" fill="#F04848"/><text class="tiny" x="455" y="709" text-anchor="middle">TRUST</text><circle cx="570" cy="433" r="16" fill="#A855F7"/><text class="tiny" x="570" y="479" text-anchor="middle">REPLIES</text><circle cx="880" cy="455" r="16" fill="#F5C518"/><text class="tiny" x="880" y="501" text-anchor="middle">SHARES</text><circle cx="1120" cy="685" r="16" fill="#F97316"/><text class="tiny" x="1120" y="731" text-anchor="middle">RISK</text><circle cx="1300" cy="525" r="16" fill="#22D3EE"/><text class="tiny" x="1300" y="571" text-anchor="middle">ACTION</text>
