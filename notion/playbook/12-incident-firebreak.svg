<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The firebreak</title>
  <desc id="desc">Stop spread, keep evidence, name one owner, then decide.</desc>
  <style>
    .title{font:700 48px Inter,Arial,sans-serif;letter-spacing:-.7px;fill:#F7F7F5}
    .sub{font:400 26px Inter,Arial,sans-serif;fill:#B8B8B4}
    .label{font:600 24px Inter,Arial,sans-serif;fill:#F7F7F5}
    .small{font:500 19px Inter,Arial,sans-serif;fill:#B8B8B4}
    .tiny{font:600 16px Inter,Arial,sans-serif;letter-spacing:1.4px;fill:#B8B8B4}
    .guide{stroke:#777772;stroke-opacity:.48;fill:none}
    .soft{fill:none;stroke-linecap:round;stroke-linejoin:round}
    @media (prefers-color-scheme:light){
      .title,.label{fill:#191919}.sub,.small,.tiny{fill:#5F5F5B}.guide{stroke:#A7A7A2}
    }
  </style>
  <text class="title" x="80" y="78">The firebreak</text>
  <text class="sub" x="80" y="122">Stop spread, keep evidence, name one owner, then decide.</text>
  <line class="guide" x1="80" y1="158" x2="1520" y2="158" stroke-width="2"/>
  
  <path d="M770 720C600 610 650 500 755 430c-15 95 85 105 70 205 90-70 120-180 70-285 165 115 245 310 125 450-95 110-315 105-420-15" fill="#F04848" fill-opacity=".16" stroke="#F04848" stroke-width="7"/>
  <path d="M400 770c-90-210-35-440 145-575M1200 770c90-210 35-440-145-575" fill="none" stroke="#34D399" stroke-width="16" stroke-linecap="round"/>
  <path d="M340 770h920" stroke="#34D399" stroke-width="16" stroke-linecap="round"/>
  <text class="label" x="295" y="235" fill="#34D399">FREEZE</text><text class="label" x="1170" y="235" fill="#34D399">OWNER</text>
  <text class="label" x="800" y="842" text-anchor="middle">PRESERVE BEFORE YOU DELETE, ARGUE, OR AMPLIFY</text>

</svg>