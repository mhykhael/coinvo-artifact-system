<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The signal radar</title>
  <desc id="desc">Scan for change. Do not scroll for entertainment.</desc>
  <style>
    .title{font:700 48px Inter,Arial,sans-serif;letter-spacing:-.7px;fill:#F7F7F5}
    .sub{font:400 26px Inter,Arial,sans-serif;fill:#B8B8B4}
    .label{font:600 24px Inter,Arial,sans-serif;fill:#F7F7F5}
    .small{font:500 19px Inter,Arial,sans-serif;fill:#B8B8B4}
    .tiny{font:600 16px Inter,Arial,sans-serif;letter-spacing:1.4px;fill:#B8B8B4}
    .guide{stroke:#777772;stroke-opacity:.48;fill:none}
    .soft{fill:none;stroke-linecap:round;stroke-linejoin:round}
    @media (prefers-color-scheme:light){
      .title,.label{fill:#191919}.sub,.small,.tiny{fill:#5F5F5B}.guide{stroke:#A7A7A2}
    }
  </style>
  <text class="title" x="80" y="78">The signal radar</text>
  <text class="sub" x="80" y="122">Scan for change. Do not scroll for entertainment.</text>
  <line class="guide" x1="80" y1="158" x2="1520" y2="158" stroke-width="2"/>
  
  <defs><radialGradient id="sweep"><stop stop-color="#34D399" stop-opacity=".32"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient></defs>
  <circle cx="700" cy="520" r="300" fill="none" stroke="#22D3EE" stroke-opacity=".3" stroke-width="3"/>
  <circle cx="700" cy="520" r="205" fill="none" stroke="#22D3EE" stroke-opacity=".3" stroke-width="3"/>
  <circle cx="700" cy="520" r="108" fill="none" stroke="#22D3EE" stroke-opacity=".3" stroke-width="3"/>
  <path d="M700 520L700 220A300 300 0 0 1 946 350Z" fill="url(#sweep)"/>
  <line x1="700" y1="520" x2="946" y2="350" stroke="#34D399" stroke-width="6"/>
  <circle cx="548" cy="390" r="16" fill="#F5C518"/><circle cx="548" cy="390" r="30" fill="none" stroke="#F5C518" stroke-opacity=".35" stroke-width="4"/><text class="tiny" x="590" y="397">NUMBER</text><circle cx="865" cy="510" r="16" fill="#F97316"/><circle cx="865" cy="510" r="30" fill="none" stroke="#F97316" stroke-opacity=".35" stroke-width="4"/><text class="tiny" x="907" y="517">AUTHORITY</text><circle cx="620" cy="665" r="16" fill="#A855F7"/><circle cx="620" cy="665" r="30" fill="none" stroke="#A855F7" stroke-opacity=".35" stroke-width="4"/><text class="tiny" x="662" y="672">CHANGE</text><circle cx="780" cy="330" r="16" fill="#F04848"/><circle cx="780" cy="330" r="30" fill="none" stroke="#F04848" stroke-opacity=".35" stroke-width="4"/><text class="tiny" x="822" y="337">CONFLICT</text>
  <path d="M1080 300v430" class="guide" stroke-width="2"/>
  <text class="label" x="1140" y="355">LOOK FOR</text>
  <text class="small" x="1140" y="410">A real change</text><text class="small" x="1140" y="455">A known source</text><text class="small" x="1140" y="500">A clear number</text><text class="small" x="1140" y="545">A fresh conflict</text><text class="small" x="1140" y="590">A direct audience effect</text>
  <text class="label" x="1140" y="685" fill="#F04848">CANDIDATE ≠ POST</text>

</svg>