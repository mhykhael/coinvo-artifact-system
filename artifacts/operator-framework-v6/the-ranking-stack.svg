<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870" role="img" aria-labelledby="title desc">
  <title id="title">The ranking stack</title>
  <desc id="desc">Candidate pools become a personalized Home slate through prediction, weighted value, diversity, and policy controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="870" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The ranking stack</text>
  <text x="72" y="142" class="subtitle">Candidate pools become a personalized Home slate through prediction, weighted value, diversity, and policy controls.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<text x="72" y="238" class="label mono" fill="#22D3EE">CANDIDATE POOLS</text><g>
    <rect x="72" y="265" width="270" height="110" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="92" y="295" class="label mono" fill="#22D3EE">POOL 1</text>
    <text x="92" y="332" class="cardTitle" text-anchor="start"><tspan x="92" dy="0">Thunder</tspan></text>
    <text x="92" y="364" class="small" text-anchor="start"><tspan x="92" dy="0">Followed accounts</tspan></text>
  </g><g>
    <rect x="72" y="400" width="270" height="110" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="92" y="430" class="label mono" fill="#22D3EE">POOL 2</text>
    <text x="92" y="467" class="cardTitle" text-anchor="start"><tspan x="92" dy="0">Phoenix</tspan></text>
    <text x="92" y="499" class="small" text-anchor="start"><tspan x="92" dy="0">Semantic discovery</tspan></text>
  </g><g>
    <rect x="72" y="535" width="270" height="110" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="92" y="565" class="label mono" fill="#22D3EE">POOL 3</text>
    <text x="92" y="602" class="cardTitle" text-anchor="start"><tspan x="92" dy="0">SimClusters</tspan></text>
    <text x="92" y="634" class="small" text-anchor="start"><tspan x="92" dy="0">Behavioral discovery</tspan></text>
  </g><line x1="360" y1="447" x2="438" y2="447" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="456" y="342" width="260" height="210" rx="8" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".58"/>
    <text x="476" y="372" class="label mono" fill="#A855F7">VIEWER MODEL</text>
    <text x="476" y="409" class="cardTitle" text-anchor="start"><tspan x="476" dy="0">Predicted value</tspan></text>
    <text x="476" y="441" class="small" text-anchor="start"><tspan x="476" dy="0">Actions</tspan><tspan x="476" dy="25">Attention</tspan><tspan x="476" dy="25">Follows</tspan><tspan x="476" dy="25">Negative feedback</tspan></text>
  </g><line x1="734" y1="447" x2="802" y2="447" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><g>
    <rect x="820" y="342" width="250" height="210" rx="8" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".58"/>
    <text x="840" y="372" class="label mono" fill="#F5C518">WEIGHTED VALUE</text>
    <text x="840" y="409" class="cardTitle" text-anchor="start"><tspan x="840" dy="0">Personal score</tspan></text>
    <text x="840" y="441" class="small" text-anchor="start"><tspan x="840" dy="0">Model coefficients</tspan><tspan x="840" dy="25">Viewer specific</tspan><tspan x="840" dy="25">Not creator points</tspan></text>
  </g><line x1="1088" y1="447" x2="1140" y2="447" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="1158" y="342" width="210" height="210" rx="8" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".58"/>
    <text x="1178" y="372" class="label mono" fill="#34D399">HOME SLATE</text>
    <text x="1178" y="409" class="cardTitle" text-anchor="start"><tspan x="1178" dy="0">Final order</tspan></text>
    <text x="1178" y="441" class="small" text-anchor="start"><tspan x="1178" dy="0">Relevant</tspan><tspan x="1178" dy="25">Diverse</tspan><tspan x="1178" dy="25">Eligible</tspan></text>
  </g><rect x="456" y="640" width="912" height="130" rx="9" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".58"/><text x="482" y="677" class="label mono" fill="#F04848">FILTER AND PENALTY RAIL</text><text x="482" y="718" class="body">Already seen · duplicate · stale · unsafe · low quality · negative feedback</text><text x="482" y="751" class="small">Ranking and visibility remain separate systems.</text></svg>
