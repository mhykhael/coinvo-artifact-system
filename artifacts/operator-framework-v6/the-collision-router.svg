<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">The collision router</title>
  <desc id="desc">Every competing story receives one explicit control and one recorded queue state.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="930" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The collision router</text>
  <text x="72" y="142" class="subtitle">Every competing story receives one explicit control and one recorded queue state.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<text x="72" y="235" class="label mono" fill="#6B7280">TRIGGER</text><text x="486" y="235" class="label mono" fill="#6B7280">CONTROL</text><text x="1110" y="235" class="label mono" fill="#6B7280">QUEUE STATE</text><rect x="72" y="265" width="345" height="84" rx="7" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".55"/><text x="94" y="300" class="label mono" fill="#F04848">01</text><text x="94" y="330" class="body">Incident or correction</text><line x1="426" y1="307" x2="468" y2="307" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="265" width="525" height="84" rx="7" fill="#111318" stroke="#2A2E36"/><text x="510" y="299" class="body" text-anchor="start"><tspan x="510" dy="0">Freeze dependent publishing and amplification</tspan></text><line x1="1022" y1="307" x2="1088" y2="307" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="1110" y="265" width="258" height="84" rx="7" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".55"/><text x="1239" y="302" class="body" text-anchor="middle"><tspan x="1239" dy="0">Lock</tspan></text><rect x="72" y="383" width="345" height="84" rx="7" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".55"/><text x="94" y="418" class="label mono" fill="#34D399">02</text><text x="94" y="448" class="body">Global breaking event</text><line x1="426" y1="425" x2="468" y2="425" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="383" width="525" height="84" rx="7" fill="#111318" stroke="#2A2E36"/><text x="510" y="417" class="body" text-anchor="start"><tspan x="510" dy="0">Clear every gate, then displace lower value work</tspan></text><line x1="1022" y1="425" x2="1088" y2="425" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="1110" y="383" width="258" height="84" rx="7" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".55"/><text x="1239" y="420" class="body" text-anchor="middle"><tspan x="1239" dy="0">Move</tspan></text><rect x="72" y="501" width="345" height="84" rx="7" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".55"/><text x="94" y="536" class="label mono" fill="#F5C518">03</text><text x="94" y="566" class="body">Breaking versus breaking</text><line x1="426" y1="543" x2="468" y2="543" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="501" width="525" height="84" rx="7" fill="#111318" stroke="#2A2E36"/><text x="510" y="535" class="body" text-anchor="start"><tspan x="510" dy="0">Rank by proof, consequence, and original value</tspan></text><line x1="1022" y1="543" x2="1088" y2="543" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="1110" y="501" width="258" height="84" rx="7" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".55"/><text x="1239" y="538" class="body" text-anchor="middle"><tspan x="1239" dy="0">Keep or delay</tspan></text><rect x="72" y="619" width="345" height="84" rx="7" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".55"/><text x="94" y="654" class="label mono" fill="#A855F7">04</text><text x="94" y="684" class="body">Partner obligation</text><line x1="426" y1="661" x2="468" y2="661" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="619" width="525" height="84" rx="7" fill="#111318" stroke="#2A2E36"/><text x="510" y="653" class="body" text-anchor="start"><tspan x="510" dy="0">Require named human approval before displacement</tspan></text><line x1="1022" y1="661" x2="1088" y2="661" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="1110" y="619" width="258" height="84" rx="7" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".55"/><text x="1239" y="656" class="body" text-anchor="middle"><tspan x="1239" dy="0">Lock or move</tspan></text><rect x="72" y="737" width="345" height="84" rx="7" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".55"/><text x="94" y="772" class="label mono" fill="#22D3EE">05</text><text x="94" y="802" class="body">Ordinary overlap</text><line x1="426" y1="779" x2="468" y2="779" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="737" width="525" height="84" rx="7" fill="#111318" stroke="#2A2E36"/><text x="510" y="771" class="body" text-anchor="start"><tspan x="510" dy="0">Check marginal value, diversity, and portfolio</tspan><tspan x="510" dy="23">similarity</tspan></text><line x1="1022" y1="779" x2="1088" y2="779" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="1110" y="737" width="258" height="84" rx="7" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".55"/><text x="1239" y="774" class="body" text-anchor="middle"><tspan x="1239" dy="0">Keep, delay, move,</tspan><tspan x="1239" dy="24">or cancel</tspan></text><rect x="72" y="872" width="1296" height="42" rx="7" fill="#111318" stroke="#2A2E36"/><text x="720" y="899" class="small" text-anchor="middle">Emotional intensity alone never creates a global exception.</text></svg>
