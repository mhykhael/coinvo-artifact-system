<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">The value flywheel</title>
  <desc id="desc">The v6 original value learning loop that replaces legacy adapted winner and repost loops.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="920" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The value flywheel</text>
  <text x="72" y="142" class="subtitle">Verified evidence becomes original value, then returns as better evidence for the next decision.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<ellipse cx="720" cy="505" rx="390" ry="230" fill="none" stroke="#2A2E36" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="720" cy="505" r="112" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-width="2"/>
    <text x="720" y="489" class="label mono" text-anchor="middle" fill="#A855F7">PRIMARY ENGINE</text>
    <text x="720" y="532" class="stat" text-anchor="middle" fill="#F5F5F4">Original value</text>
    <text x="720" y="562" class="small" text-anchor="middle">Owned thesis and expression</text><g>
    <rect x="610" y="235" width="220" height="138" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="630" y="265" class="label mono" fill="#22D3EE">01 · VERIFY</text>
    <text x="630" y="302" class="cardTitle" text-anchor="start"><tspan x="630" dy="0">Evidence</tspan></text>
    <text x="630" y="334" class="small" text-anchor="start"><tspan x="630" dy="0">Exact claim</tspan><tspan x="630" dy="20">Source packet</tspan></text>
  </g><g>
    <rect x="990" y="330" width="220" height="138" rx="8" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".58"/>
    <text x="1010" y="360" class="label mono" fill="#F5C518">02 · DEFINE</text>
    <text x="1010" y="397" class="cardTitle" text-anchor="start"><tspan x="1010" dy="0">Thesis</tspan></text>
    <text x="1010" y="429" class="small" text-anchor="start"><tspan x="1010" dy="0">Consequence</tspan><tspan x="1010" dy="20">Audience job</tspan></text>
  </g><g>
    <rect x="990" y="575" width="220" height="138" rx="8" fill="rgba(249,115,22,.09)" stroke="#F97316" stroke-opacity=".58"/>
    <text x="1010" y="605" class="label mono" fill="#F97316">03 · CREATE</text>
    <text x="1010" y="642" class="cardTitle" text-anchor="start"><tspan x="1010" dy="0">Package</tspan></text>
    <text x="1010" y="674" class="small" text-anchor="start"><tspan x="1010" dy="0">Human writing</tspan><tspan x="1010" dy="20">Owned or cleared media</tspan></text>
  </g><g>
    <rect x="610" y="690" width="220" height="138" rx="8" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".58"/>
    <text x="630" y="720" class="label mono" fill="#34D399">04 · PUBLISH</text>
    <text x="630" y="757" class="cardTitle" text-anchor="start"><tspan x="630" dy="0">Live post</tspan></text>
    <text x="630" y="789" class="small" text-anchor="start"><tspan x="630" dy="0">Named publisher</tspan><tspan x="630" dy="20">Versioned record</tspan></text>
  </g><g>
    <rect x="230" y="575" width="220" height="138" rx="8" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".58"/>
    <text x="250" y="605" class="label mono" fill="#A855F7">05 · MEASURE</text>
    <text x="250" y="642" class="cardTitle" text-anchor="start"><tspan x="250" dy="0">Evidence</tspan></text>
    <text x="250" y="674" class="small" text-anchor="start"><tspan x="250" dy="0">Qualified response</tspan><tspan x="250" dy="20">Bounded cause</tspan></text>
  </g><g>
    <rect x="230" y="330" width="220" height="138" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="250" y="360" class="label mono" fill="#22D3EE">06 · EXTEND</text>
    <text x="250" y="397" class="cardTitle" text-anchor="start"><tspan x="250" dy="0">New value</tspan></text>
    <text x="250" y="429" class="small" text-anchor="start"><tspan x="250" dy="0">Material change</tspan><tspan x="250" dy="20">Fresh treatment</tspan></text>
  </g><line x1="832.5365300168585" y1="332.1341325042146" x2="987.4634699831415" y2="370.8658674957854" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><line x1="1100" y1="515" x2="1100" y2="528" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><line x1="988.9728898371296" y1="677.6003096545529" x2="831.0271101628704" y2="725.3996903454471" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><line x1="608.9728898371296" y1="725.3996903454471" x2="451.0271101628704" y2="677.6003096545529" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><line x1="340" y1="528" x2="340" y2="515" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><line x1="452.5365300168585" y1="370.8658674957854" x2="607.4634699831415" y2="332.1341325042146" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><rect x="72" y="848" width="1296" height="48" rx="7" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".58"/>
    <text x="720" y="879" class="label mono" text-anchor="middle" fill="#F04848">NO COPYING · NO COSMETIC MUTATION · NO AUTOMATED FINAL AUTHORSHIP</text></svg>
