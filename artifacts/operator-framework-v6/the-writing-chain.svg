<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">The writing chain</title>
  <desc id="desc">Five human decisions convert a verified source packet into one accountable live record.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="850" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The writing chain</text>
  <text x="72" y="142" class="subtitle">Five human decisions convert a verified source packet into one accountable live record.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<g>
    <rect x="72" y="268" width="226" height="300" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="92" y="298" class="label mono" fill="#22D3EE">01 · THESIS</text>
    <text x="92" y="335" class="cardTitle" text-anchor="start"><tspan x="92" dy="0">Own the claim</tspan></text>
    <text x="92" y="367" class="small" text-anchor="start"><tspan x="92" dy="0">Input · source packet</tspan><tspan x="92" dy="30">Artifact · thesis brief</tspan></text>
  </g><line x1="304" y1="418" x2="322" y2="418" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="330" y="268" width="226" height="300" rx="8" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".58"/>
    <text x="350" y="298" class="label mono" fill="#A855F7">02 · WRITE</text>
    <text x="350" y="335" class="cardTitle" text-anchor="start"><tspan x="350" dy="0">Express it</tspan><tspan x="350" dy="28">faithfully</tspan></text>
    <text x="350" y="395" class="small" text-anchor="start"><tspan x="350" dy="0">Input · approved thesis</tspan><tspan x="350" dy="30">Artifact · original copy</tspan></text>
  </g><line x1="562" y1="418" x2="580" y2="418" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="588" y="268" width="226" height="300" rx="8" fill="rgba(249,115,22,.09)" stroke="#F97316" stroke-opacity=".58"/>
    <text x="608" y="298" class="label mono" fill="#F97316">03 · MEDIA</text>
    <text x="608" y="335" class="cardTitle" text-anchor="start"><tspan x="608" dy="0">Choose the</tspan><tspan x="608" dy="28">visual job</tspan></text>
    <text x="608" y="395" class="small" text-anchor="start"><tspan x="608" dy="0">Input · copy and rights</tspan><tspan x="608" dy="30">Artifact · cleared media</tspan></text>
  </g><line x1="820" y1="418" x2="838" y2="418" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="846" y="268" width="226" height="300" rx="8" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".58"/>
    <text x="866" y="298" class="label mono" fill="#F5C518">04 · PREFLIGHT</text>
    <text x="866" y="335" class="cardTitle" text-anchor="start"><tspan x="866" dy="0">Resolve every</tspan><tspan x="866" dy="28">gate</tspan></text>
    <text x="866" y="395" class="small" text-anchor="start"><tspan x="866" dy="0">Input · complete package</tspan><tspan x="866" dy="30">Artifact · publish clearance</tspan></text>
  </g><line x1="1078" y1="418" x2="1096" y2="418" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="1104" y="268" width="226" height="300" rx="8" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".58"/>
    <text x="1124" y="298" class="label mono" fill="#34D399">05 · PUBLISH</text>
    <text x="1124" y="335" class="cardTitle" text-anchor="start"><tspan x="1124" dy="0">Perform one</tspan><tspan x="1124" dy="28">human action</tspan></text>
    <text x="1124" y="395" class="small" text-anchor="start"><tspan x="1124" dy="0">Input · account and slot</tspan><tspan x="1124" dy="30">Artifact · live post record</tspan></text>
  </g><rect x="72" y="630" width="1296" height="142" rx="9" fill="#111318" stroke="#2A2E36"/><text x="98" y="671" class="label mono" fill="#A855F7">TRACEABILITY RULE</text><text x="98" y="715" class="stat">Every irreversible decision leaves a complete artifact.</text><text x="98" y="750" class="small">Owner · source · rights · approval · version · next state</text></svg>
