  <text x="72" y="92" class="title">The automation boundary</text>
  <text x="72" y="142" class="subtitle">Software accelerates repeatable controls while named humans retain authorship, judgment, and accountability.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<rect x="72" y="245" width="270" height="500" rx="9" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".6"/><text x="94" y="284" class="label mono" fill="#34D399">MACHINE READY</text><text x="94" y="336" class="stat">Execute</text><circle cx="101" cy="393" r="5" fill="#34D399"/><text x="120" y="399" class="body">Clocks and metadata</text><circle cx="101" cy="451" r="5" fill="#34D399"/><text x="120" y="457" class="body">Required field checks</text><circle cx="101" cy="509" r="5" fill="#34D399"/><text x="120" y="515" class="body">Explicit thresholds</text><circle cx="101" cy="567" r="5" fill="#34D399"/><text x="120" y="573" class="body">Collision enforcement</text><circle cx="101" cy="625" r="5" fill="#34D399"/><text x="120" y="631" class="body">Audit capture</text><rect x="398" y="245" width="270" height="500" rx="9" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".6"/><text x="420" y="284" class="label mono" fill="#F5C518">HUMAN ASSISTED</text><text x="420" y="336" class="stat">Propose</text><circle cx="427" cy="393" r="5" fill="#F5C518"/><text x="446" y="399" class="body">Candidate detection</text><circle cx="427" cy="451" r="5" fill="#F5C518"/><text x="446" y="457" class="body">Research clustering</text><circle cx="427" cy="509" r="5" fill="#F5C518"/><text x="446" y="515" class="body">Claim extraction</text><circle cx="427" cy="567" r="5" fill="#F5C518"/><text x="446" y="573" class="body">Evidence gaps</text><circle cx="427" cy="625" r="5" fill="#F5C518"/><text x="446" y="631" class="body">Quality warnings</text><rect x="724" y="245" width="270" height="500" rx="9" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".6"/><text x="746" y="284" class="label mono" fill="#22D3EE">HUMAN LED</text><text x="746" y="336" class="stat">Decide</text><circle cx="753" cy="393" r="5" fill="#22D3EE"/><text x="772" y="399" class="body">Original thesis</text><circle cx="753" cy="451" r="5" fill="#22D3EE"/><text x="772" y="457" class="body">Final expression</text><circle cx="753" cy="509" r="5" fill="#22D3EE"/><text x="772" y="515" class="body">Sensitive framing</text><circle cx="753" cy="567" r="5" fill="#22D3EE"/><text x="772" y="573" class="body">Rights judgment</text><circle cx="753" cy="625" r="5" fill="#22D3EE"/><text x="772" y="631" class="body">Approval and publish</text><rect x="1050" y="245" width="270" height="500" rx="9" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".6"/><text x="1072" y="284" class="label mono" fill="#F04848">BLOCKED</text><text x="1072" y="336" class="stat">Never infer</text><circle cx="1079" cy="393" r="5" fill="#F04848"/><text x="1098" y="399" class="body">Missing source</text><circle cx="1079" cy="451" r="5" fill="#F04848"/><text x="1098" y="457" class="body">Missing policy</text><circle cx="1079" cy="509" r="5" fill="#F04848"/><text x="1098" y="515" class="body">Missing permission</text><circle cx="1079" cy="567" r="5" fill="#F04848"/><text x="1098" y="573" class="body">Unnamed owner</text><circle cx="1079" cy="625" r="5" fill="#F04848"/><text x="1098" y="631" class="body">Silent override</text><line x1="102" y1="807" x2="1338" y2="807" stroke="#2A2E36" stroke-width="8" stroke-linecap="round"/><circle cx="102" cy="807" r="9" fill="#34D399"/><circle cx="514" cy="807" r="9" fill="#F5C518"/><circle cx="926" cy="807" r="9" fill="#22D3EE"/><circle cx="1338" cy="807" r="9" fill="#F04848"/><text x="102" y="851" class="label mono" fill="#34D399">DETERMINISTIC</text><text x="1338" y="851" class="label mono" text-anchor="end" fill="#F04848">IRREVERSIBLE JUDGMENT</text></svg>
