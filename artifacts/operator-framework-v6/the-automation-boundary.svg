<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">The automation boundary</title>
  <desc id="desc">Software accelerates repeatable controls while named humans retain authorship, judgment, and accountability.</desc>
