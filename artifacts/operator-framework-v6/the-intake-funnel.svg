<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">The intake funnel</title>
  <desc id="desc">Weak or unsafe signals leave early so production time reaches only cleared opportunities.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="960" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The intake funnel</text>
  <text x="72" y="142" class="subtitle">Weak or unsafe signals leave early so production time reaches only cleared opportunities.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<rect x="110" y="230" width="1220" height="58" rx="7" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".52"/><text x="132" y="266" class="label mono" fill="#F04848">01 · HARD STOP</text><text x="475" y="267" class="body">Prohibited, fabricated, manipulated, or unsafe</text><line x1="720" y1="291" x2="720" y2="303" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="142.5" y="306" width="1155" height="58" rx="7" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".52"/><text x="164.5" y="342" class="label mono" fill="#22D3EE">02 · EXACT PROOF</text><text x="507.5" y="343" class="body">A qualifying source supports the proposed claim</text><line x1="720" y1="367" x2="720" y2="379" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="175" y="382" width="1090" height="58" rx="7" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".52"/><text x="197" y="418" class="label mono" fill="#34D399">03 · BRAND FIT</text><text x="540" y="419" class="body">Audience and topic cluster match the active profile</text><line x1="720" y1="443" x2="720" y2="455" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="207.5" y="458" width="1025" height="58" rx="7" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".52"/><text x="229.5" y="494" class="label mono" fill="#F5C518">04 · CONSEQUENCE</text><text x="572.5" y="495" class="body">The change matters to a defined audience now</text><line x1="720" y1="519" x2="720" y2="531" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="534" width="960" height="58" rx="7" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".52"/><text x="262" y="570" class="label mono" fill="#A855F7">05 · ORIGINAL VALUE</text><text x="605" y="571" class="body">A material independent contribution remains available</text><line x1="720" y1="595" x2="720" y2="607" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="272.5" y="610" width="895" height="58" rx="7" fill="rgba(249,115,22,.09)" stroke="#F97316" stroke-opacity=".52"/><text x="294.5" y="646" class="label mono" fill="#F97316">06 · RIGHTS AND AUTHORSHIP</text><text x="637.5" y="647" class="body">Provenance, route, rights, and human ownership are clear</text><line x1="720" y1="671" x2="720" y2="683" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="305" y="686" width="830" height="58" rx="7" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".52"/><text x="327" y="722" class="label mono" fill="#22D3EE">07 · COLLISION AND OWNER</text><text x="670" y="723" class="body">Portfolio overlap, queue state, deadline, and owner resolve</text><path d="M405 783 L1035 783 L930 862 L510 862 Z" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-width="2"/><text x="720" y="822" class="label mono" text-anchor="middle" fill="#34D399">CLEARED OUTPUT</text><text x="720" y="851" class="cardTitle" text-anchor="middle">Ranked writing brief</text><g><rect x="195" y="892" width="180" height="38" rx="19" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".5"/><text x="285" y="917" class="tiny" text-anchor="middle" fill="#F5C518">Hold</text></g><g><rect x="405" y="892" width="180" height="38" rx="19" fill="rgba(249,115,22,.09)" stroke="#F97316" stroke-opacity=".5"/><text x="495" y="917" class="tiny" text-anchor="middle" fill="#F97316">Skip</text></g><g><rect x="615" y="892" width="180" height="38" rx="19" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".5"/><text x="705" y="917" class="tiny" text-anchor="middle" fill="#22D3EE">Route</text></g><g><rect x="825" y="892" width="180" height="38" rx="19" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".5"/><text x="915" y="917" class="tiny" text-anchor="middle" fill="#F04848">Kill</text></g><g><rect x="1035" y="892" width="180" height="38" rx="19" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".5"/><text x="1125" y="917" class="tiny" text-anchor="middle" fill="#A855F7">Escalate</text></g></svg>
