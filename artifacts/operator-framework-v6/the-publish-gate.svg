<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">The publish gate</title>
  <desc id="desc">A package reaches the account only when all six permanent controls pass together.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The publish gate</text>
  <text x="72" y="142" class="subtitle">A package reaches the account only when all six permanent controls pass together.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<g>
    <rect x="72" y="245" width="392" height="174" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="92" y="275" class="label mono" fill="#22D3EE">01 · TRUTH</text>
    <text x="92" y="312" class="cardTitle" text-anchor="start"><tspan x="92" dy="0">Exact claim, source,</tspan><tspan x="92" dy="28">context, certainty</tspan></text>
    <text x="92" y="372" class="small" text-anchor="start"><tspan x="92" dy="0">PASS OR STOP</tspan></text>
  </g><line x1="268" y1="421" x2="720" y2="712" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="504" y="245" width="392" height="174" rx="8" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".58"/>
    <text x="524" y="275" class="label mono" fill="#A855F7">02 · VALUE</text>
    <text x="524" y="312" class="cardTitle" text-anchor="start"><tspan x="524" dy="0">Material brand</tspan><tspan x="524" dy="28">contribution and primary</tspan><tspan x="524" dy="28">value</tspan></text>
    <text x="524" y="400" class="small" text-anchor="start"><tspan x="524" dy="0">PASS OR STOP</tspan></text>
  </g><line x1="700" y1="421" x2="720" y2="712" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="936" y="245" width="392" height="174" rx="8" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".58"/>
    <text x="956" y="275" class="label mono" fill="#F5C518">03 · RIGHTS</text>
    <text x="956" y="312" class="cardTitle" text-anchor="start"><tspan x="956" dy="0">Origin, license, credit,</tspan><tspan x="956" dy="28">and route</tspan></text>
    <text x="956" y="372" class="small" text-anchor="start"><tspan x="956" dy="0">PASS OR STOP</tspan></text>
  </g><line x1="1132" y1="421" x2="720" y2="712" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="72" y="465" width="392" height="174" rx="8" fill="rgba(249,115,22,.09)" stroke="#F97316" stroke-opacity=".58"/>
    <text x="92" y="495" class="label mono" fill="#F97316">04 · AUTHORSHIP</text>
    <text x="92" y="532" class="cardTitle" text-anchor="start"><tspan x="92" dy="0">Named human author,</tspan><tspan x="92" dy="28">approver, and publisher</tspan></text>
    <text x="92" y="592" class="small" text-anchor="start"><tspan x="92" dy="0">PASS OR STOP</tspan></text>
  </g><line x1="268" y1="641" x2="720" y2="712" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="504" y="465" width="392" height="174" rx="8" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".58"/>
    <text x="524" y="495" class="label mono" fill="#F04848">05 · SIMILARITY</text>
    <text x="524" y="532" class="cardTitle" text-anchor="start"><tspan x="524" dy="0">No duplicate copy, media,</tspan><tspan x="524" dy="28">execution, or audience job</tspan></text>
    <text x="524" y="592" class="small" text-anchor="start"><tspan x="524" dy="0">PASS OR STOP</tspan></text>
  </g><line x1="700" y1="641" x2="720" y2="712" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="936" y="465" width="392" height="174" rx="8" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".58"/>
    <text x="956" y="495" class="label mono" fill="#34D399">06 · DELIVERY</text>
    <text x="956" y="532" class="cardTitle" text-anchor="start"><tspan x="956" dy="0">Account, format, access,</tspan><tspan x="956" dy="28">slot, collision, and</tspan><tspan x="956" dy="28">handoff</tspan></text>
    <text x="956" y="620" class="small" text-anchor="start"><tspan x="956" dy="0">PASS OR STOP</tspan></text>
  </g><line x1="1132" y1="641" x2="720" y2="712" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="442" y="712" width="556" height="112" rx="10" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-width="2"/><text x="720" y="755" class="label mono" text-anchor="middle" fill="#34D399">ALL SIX PASS</text><text x="720" y="798" class="stat" text-anchor="middle">Human publishes</text></svg>
