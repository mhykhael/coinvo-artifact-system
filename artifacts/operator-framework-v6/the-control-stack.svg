<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">The control stack</title>
  <desc id="desc">Eleven dependent layers move an event from setup to governed evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The control stack</text>
  <text x="72" y="142" class="subtitle">Eleven dependent layers move an event from setup to governed evidence.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<text x="72" y="235" class="label mono" fill="#22D3EE">BEFORE LIVE</text><text x="774" y="235" class="label mono" fill="#A855F7">AFTER LIVE</text><rect x="72" y="260" width="568" height="76" rx="7" fill="#111318" stroke="#22D3EE" stroke-opacity=".35"/><text x="98" y="291" class="label mono" fill="#22D3EE">01</text><text x="150" y="293" class="cardTitle">Setup</text><text x="420" y="291" class="small">Ready workspace</text><line x1="356" y1="338" x2="356" y2="356" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="360" width="568" height="76" rx="7" fill="#15181E" stroke="#22D3EE" stroke-opacity=".35"/><text x="98" y="391" class="label mono" fill="#22D3EE">02</text><text x="150" y="393" class="cardTitle">Source</text><text x="420" y="391" class="small">Candidate signal</text><line x1="356" y1="438" x2="356" y2="456" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="460" width="568" height="76" rx="7" fill="#111318" stroke="#22D3EE" stroke-opacity=".35"/><text x="98" y="491" class="label mono" fill="#22D3EE">03</text><text x="150" y="493" class="cardTitle">Decide</text><text x="420" y="491" class="small">Priority state</text><line x1="356" y1="538" x2="356" y2="556" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="560" width="568" height="76" rx="7" fill="#15181E" stroke="#22D3EE" stroke-opacity=".35"/><text x="98" y="591" class="label mono" fill="#22D3EE">04</text><text x="150" y="593" class="cardTitle">Prove</text><text x="420" y="591" class="small">Verified packet</text><line x1="356" y1="638" x2="356" y2="656" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="660" width="568" height="76" rx="7" fill="#111318" stroke="#22D3EE" stroke-opacity=".35"/><text x="98" y="691" class="label mono" fill="#22D3EE">05</text><text x="150" y="693" class="cardTitle">Define</text><text x="420" y="691" class="small">Value route and thesis</text><line x1="356" y1="738" x2="356" y2="756" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="760" width="568" height="76" rx="7" fill="#15181E" stroke="#22D3EE" stroke-opacity=".35"/><text x="98" y="791" class="label mono" fill="#22D3EE">06</text><text x="150" y="793" class="cardTitle">Build</text><text x="420" y="791" class="small">Publish ready package</text><rect x="774" y="260" width="594" height="90" rx="7" fill="#111318" stroke="#A855F7" stroke-opacity=".4"/><text x="800" y="295" class="label mono" fill="#A855F7">07</text><text x="852" y="297" class="cardTitle">Publish</text><text x="1095" y="295" class="small">Live post record</text><line x1="1070" y1="352" x2="1070" y2="376" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><rect x="774" y="380" width="594" height="90" rx="7" fill="#15181E" stroke="#A855F7" stroke-opacity=".4"/><text x="800" y="415" class="label mono" fill="#A855F7">08</text><text x="852" y="417" class="cardTitle">Observe</text><text x="1095" y="415" class="small">Momentum and risk state</text><line x1="1070" y1="472" x2="1070" y2="496" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><rect x="774" y="500" width="594" height="90" rx="7" fill="#111318" stroke="#A855F7" stroke-opacity=".4"/><text x="800" y="535" class="label mono" fill="#A855F7">09</text><text x="852" y="537" class="cardTitle">Distribute</text><text x="1095" y="535" class="small">Attributed action</text><line x1="1070" y1="592" x2="1070" y2="616" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><rect x="774" y="620" width="594" height="90" rx="7" fill="#15181E" stroke="#A855F7" stroke-opacity=".4"/><text x="800" y="655" class="label mono" fill="#A855F7">10</text><text x="852" y="657" class="cardTitle">Learn</text><text x="1095" y="655" class="small">Evidence and hypothesis</text><line x1="1070" y1="712" x2="1070" y2="736" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/><rect x="774" y="740" width="594" height="90" rx="7" fill="#111318" stroke="#A855F7" stroke-opacity=".4"/><text x="800" y="775" class="label mono" fill="#A855F7">11</text><text x="852" y="777" class="cardTitle">Govern</text><text x="1095" y="775" class="small">Decision, policy, or incident</text><path d="M640 798 C705 798 708 305 770 305" fill="none" stroke="#34D399" stroke-width="3" marker-end="url(#arrowGreen)"/><rect x="658" y="470" width="94" height="46" rx="23" fill="rgba(52,211,153,.09)" stroke="#34D399"/><text x="705" y="500" class="label mono" text-anchor="middle" fill="#34D399">LIVE</text><rect x="72" y="900" width="1296" height="76" rx="8" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".58"/><text x="720" y="948" class="cardTitle" text-anchor="middle">Fix the lowest failed layer first. A downstream layer cannot repair it.</text></svg>
