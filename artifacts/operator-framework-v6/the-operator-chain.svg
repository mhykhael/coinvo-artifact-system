<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
  <title id="title">The operator chain</title>
  <desc id="desc">The complete Operator Framework sequence from shift setup through governance and learning.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="950" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The operator chain</text>
  <text x="72" y="142" class="subtitle">Eight controlled states turn one verified signal into reusable operating knowledge.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<g>
    <rect x="72" y="238" width="270" height="176" rx="8" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".58"/>
    <text x="92" y="268" class="label mono" fill="#34D399">STEP 01</text>
    <text x="92" y="305" class="cardTitle" text-anchor="start"><tspan x="92" dy="0">Shift setup</tspan></text>
    <text x="92" y="337" class="small" text-anchor="start"><tspan x="92" dy="0">Profile, queue, sources</tspan><tspan x="92" dy="23">Output · ready workspace</tspan></text>
  </g><line x1="350" y1="326" x2="388" y2="326" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="398" y="238" width="270" height="176" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="418" y="268" class="label mono" fill="#22D3EE">STEP 02</text>
    <text x="418" y="305" class="cardTitle" text-anchor="start"><tspan x="418" dy="0">Signal intake</tspan></text>
    <text x="418" y="337" class="small" text-anchor="start"><tspan x="418" dy="0">Detect and filter change</tspan><tspan x="418" dy="23">Output · candidate signal</tspan></text>
  </g><line x1="676" y1="326" x2="714" y2="326" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="724" y="238" width="270" height="176" rx="8" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".58"/>
    <text x="744" y="268" class="label mono" fill="#F5C518">STEP 03</text>
    <text x="744" y="305" class="cardTitle" text-anchor="start"><tspan x="744" dy="0">Proof control</tspan></text>
    <text x="744" y="337" class="small" text-anchor="start"><tspan x="744" dy="0">Verify claim and risk</tspan><tspan x="744" dy="23">Output · cleared packet</tspan></text>
  </g><line x1="1002" y1="326" x2="1040" y2="326" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="1050" y="238" width="270" height="176" rx="8" fill="rgba(249,115,22,.09)" stroke="#F97316" stroke-opacity=".58"/>
    <text x="1070" y="268" class="label mono" fill="#F97316">STEP 04</text>
    <text x="1070" y="305" class="cardTitle" text-anchor="start"><tspan x="1070" dy="0">Original build</tspan></text>
    <text x="1070" y="337" class="small" text-anchor="start"><tspan x="1070" dy="0">Thesis, copy, and media</tspan><tspan x="1070" dy="23">Output · approved package</tspan></text>
  </g><path d="M1320 326 Q1360 326 1360 466 Q1360 606 1328 606" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="72" y="518" width="270" height="176" rx="8" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".58"/>
    <text x="92" y="548" class="label mono" fill="#F04848">STEP 08</text>
    <text x="92" y="585" class="cardTitle" text-anchor="start"><tspan x="92" dy="0">Shift close</tspan></text>
    <text x="92" y="617" class="small" text-anchor="start"><tspan x="92" dy="0">Assign every open state</tspan><tspan x="92" dy="23">Output · owner and next action</tspan></text>
  </g><g>
    <rect x="398" y="518" width="270" height="176" rx="8" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".58"/>
    <text x="418" y="548" class="label mono" fill="#A855F7">STEP 07</text>
    <text x="418" y="585" class="cardTitle" text-anchor="start"><tspan x="418" dy="0">Learning loop</tspan></text>
    <text x="418" y="617" class="small" text-anchor="start"><tspan x="418" dy="0">Explain, test, and decide</tspan><tspan x="418" dy="23">Output · bounded evidence</tspan></text>
  </g><line x1="390" y1="606" x2="352" y2="606" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="724" y="518" width="270" height="176" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="744" y="548" class="label mono" fill="#22D3EE">STEP 06</text>
    <text x="744" y="585" class="cardTitle" text-anchor="start"><tspan x="744" dy="0">Early watch</tspan></text>
    <text x="744" y="617" class="small" text-anchor="start"><tspan x="744" dy="0">Read momentum and risk</tspan><tspan x="744" dy="23">Output · live status</tspan></text>
  </g><line x1="716" y1="606" x2="678" y2="606" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="1050" y="518" width="270" height="176" rx="8" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".58"/>
    <text x="1070" y="548" class="label mono" fill="#34D399">STEP 05</text>
    <text x="1070" y="585" class="cardTitle" text-anchor="start"><tspan x="1070" dy="0">Human publish</tspan></text>
    <text x="1070" y="617" class="small" text-anchor="start"><tspan x="1070" dy="0">Send the approved version</tspan><tspan x="1070" dy="23">Output · live post record</tspan></text>
  </g><line x1="1042" y1="606" x2="1004" y2="606" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="757" width="1248" height="116" rx="8" fill="#111318" stroke="#2A2E36"/>
    <text x="96" y="790" class="label mono" fill="#F04848">CONTROL PRIORITY</text>
    <text x="96" y="827" class="body" text-anchor="start"><tspan x="96" dy="0">Hard stop  →  Truth  →  Original value  →  Rights  →  Brand fit</tspan><tspan x="96" dy="30">Human clearance  →  Gated speed  →  Qualified attention  →  Business value</tspan></text>
    <path d="M210 895 C400 930 760 930 1088 885" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowPurple)"/>
    <text x="650" y="920" class="label mono" text-anchor="middle" fill="#A855F7">EVIDENCE FEEDS THE NEXT SHIFT</text></svg>
