<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">The attention chain</title>
  <desc id="desc">Attention is earned when evidence moves cleanly from objective change to trusted understanding.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="780" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The attention chain</text>
  <text x="72" y="142" class="subtitle">Attention is earned when evidence moves cleanly from objective change to trusted understanding.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<g>
    <rect x="72" y="260" width="226" height="250" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".58"/>
    <text x="92" y="290" class="label mono" fill="#22D3EE">01 · EVENT</text>
    <text x="92" y="327" class="cardTitle" text-anchor="start"><tspan x="92" dy="0">What changed?</tspan></text>
    <text x="92" y="359" class="small" text-anchor="start"><tspan x="92" dy="0"></tspan></text>
  </g><line x1="92" y1="399" x2="278" y2="399" stroke="#2A2E36"/><text x="92" y="442" class="small" fill="#F04848">Failure · vague claim</text><line x1="304" y1="385" x2="322" y2="385" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="330" y="260" width="226" height="250" rx="8" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".58"/>
    <text x="350" y="290" class="label mono" fill="#34D399">02 · CONSEQUENCE</text>
    <text x="350" y="327" class="cardTitle" text-anchor="start"><tspan x="350" dy="0">Why care now?</tspan></text>
    <text x="350" y="359" class="small" text-anchor="start"><tspan x="350" dy="0"></tspan></text>
  </g><line x1="350" y1="399" x2="536" y2="399" stroke="#2A2E36"/><text x="350" y="442" class="small" fill="#F04848">Failure · no relevance</text><line x1="562" y1="385" x2="580" y2="385" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="588" y="260" width="226" height="250" rx="8" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".58"/>
    <text x="608" y="290" class="label mono" fill="#F5C518">03 · EMOTION</text>
    <text x="608" y="327" class="cardTitle" text-anchor="start"><tspan x="608" dy="0">What feeling</tspan><tspan x="608" dy="28">follows?</tspan></text>
    <text x="608" y="387" class="small" text-anchor="start"><tspan x="608" dy="0"></tspan></text>
  </g><line x1="608" y1="399" x2="794" y2="399" stroke="#2A2E36"/><text x="608" y="442" class="small" fill="#F04848">Failure · manufactured feeling</text><line x1="820" y1="385" x2="838" y2="385" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="846" y="260" width="226" height="250" rx="8" fill="rgba(249,115,22,.09)" stroke="#F97316" stroke-opacity=".58"/>
    <text x="866" y="290" class="label mono" fill="#F97316">04 · EXPRESSION</text>
    <text x="866" y="327" class="cardTitle" text-anchor="start"><tspan x="866" dy="0">Can one glance</tspan><tspan x="866" dy="28">explain it?</tspan></text>
    <text x="866" y="387" class="small" text-anchor="start"><tspan x="866" dy="0"></tspan></text>
  </g><line x1="866" y1="399" x2="1052" y2="399" stroke="#2A2E36"/><text x="866" y="442" class="small" fill="#F04848">Failure · buried meaning</text><line x1="1078" y1="385" x2="1096" y2="385" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><g>
    <rect x="1104" y="260" width="226" height="250" rx="8" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".58"/>
    <text x="1124" y="290" class="label mono" fill="#A855F7">05 · PROOF</text>
    <text x="1124" y="327" class="cardTitle" text-anchor="start"><tspan x="1124" dy="0">Does the</tspan><tspan x="1124" dy="28">second read</tspan><tspan x="1124" dy="28">survive?</tspan></text>
    <text x="1124" y="415" class="small" text-anchor="start"><tspan x="1124" dy="0"></tspan></text>
  </g><line x1="1124" y1="399" x2="1310" y2="399" stroke="#2A2E36"/><text x="1124" y="442" class="small" fill="#F04848">Failure · evidence falls short</text><rect x="72" y="580" width="1296" height="122" rx="9" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".55"/>
    <text x="102" y="621" class="label mono" fill="#22D3EE">OPERATING RULE</text>
    <text x="102" y="666" class="stat">Attention delivers. Trusted understanding remains the product.</text></svg>
