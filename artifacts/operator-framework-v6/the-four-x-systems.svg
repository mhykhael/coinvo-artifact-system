<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
  <title id="title">The four X systems</title>
  <desc id="desc">One post can pass or fail four separate systems, so every diagnosis starts by naming the rail.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="950" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The four X systems</text>
  <text x="72" y="142" class="subtitle">One post can pass or fail four separate systems, so every diagnosis starts by naming the rail.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<rect x="72" y="252" width="180" height="530" rx="10" fill="#111318" stroke="#2A2E36"/><text x="162" y="485" class="label mono" text-anchor="middle" fill="#6B7280">ONE POST</text><circle cx="162" cy="530" r="42" fill="rgba(34,211,238,.09)" stroke="#22D3EE"/><text x="162" y="540" class="stat" text-anchor="middle">X</text><line x1="260" y1="301" x2="312" y2="301" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="245" width="750" height="112" rx="8" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".6"/><text x="356" y="279" class="label mono" fill="#22D3EE">RETRIEVAL AND RANKING</text><text x="356" y="321" class="body">Candidates → viewer prediction → ranked Home slate</text><line x1="1092" y1="301" x2="1144" y2="301" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="1162" y="245" width="206" height="112" rx="8" fill="#111318" stroke="#22D3EE" stroke-opacity=".45"/><text x="1265" y="291" class="small" text-anchor="middle"><tspan x="1265" dy="0">Recommendation</tspan><tspan x="1265" dy="23">position</tspan></text><line x1="260" y1="451" x2="312" y2="451" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="395" width="750" height="112" rx="8" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".6"/><text x="356" y="429" class="label mono" fill="#F5C518">VISIBILITY AND SAFETY</text><text x="356" y="471" class="body">Eligibility → duplicate filters → quality and safety controls</text><line x1="1092" y1="451" x2="1144" y2="451" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="1162" y="395" width="206" height="112" rx="8" fill="#111318" stroke="#F5C518" stroke-opacity=".45"/><text x="1265" y="441" class="small" text-anchor="middle"><tspan x="1265" dy="0">Reach eligibility</tspan></text><line x1="260" y1="601" x2="312" y2="601" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="545" width="750" height="112" rx="8" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".6"/><text x="356" y="579" class="label mono" fill="#A855F7">REWARDS PROGRAM</text><text x="356" y="621" class="body">Qualified Home impressions → original value tests</text><line x1="1092" y1="601" x2="1144" y2="601" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="1162" y="545" width="206" height="112" rx="8" fill="#111318" stroke="#A855F7" stroke-opacity=".45"/><text x="1265" y="591" class="small" text-anchor="middle"><tspan x="1265" dy="0">Payout eligibility</tspan></text><line x1="260" y1="751" x2="312" y2="751" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="695" width="750" height="112" rx="8" fill="rgba(240,72,72,.09)" stroke="#F04848" stroke-opacity=".6"/><text x="356" y="729" class="label mono" fill="#F04848">AUTHENTICITY POLICY</text><text x="356" y="771" class="body">Duplicate behavior → manipulation checks → enforcement</text><line x1="1092" y1="751" x2="1144" y2="751" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="1162" y="695" width="206" height="112" rx="8" fill="#111318" stroke="#F04848" stroke-opacity=".45"/><text x="1265" y="741" class="small" text-anchor="middle"><tspan x="1265" dy="0">Account and content</tspan><tspan x="1265" dy="23">risk</tspan></text><rect x="330" y="856" width="1038" height="58" rx="7" fill="#111318" stroke="#2A2E36"/><text x="849" y="893" class="body" text-anchor="middle">Diagnose the rail before changing the content system.</text></svg>
