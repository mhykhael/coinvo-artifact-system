<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">The stage model</title>
  <desc id="desc">Account maturity changes the production mix while proof, cluster, and review controls stay constant.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6B7280"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34D399"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A855F7"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F5F5F4}
      .title{font-size:60px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:23px;font-weight:400;fill:#A1A1AA}
      .label{font-size:14px;font-weight:750;letter-spacing:2px}
      .cardTitle{font-size:24px;font-weight:750}
      .body{font-size:18px;font-weight:500;fill:#D5D7DC}
      .small{font-size:15px;font-weight:500;fill:#A1A1AA}
      .tiny{font-size:13px;font-weight:600;fill:#A1A1AA}
      .stat{font-size:34px;font-weight:800}
      .mono{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="930" fill="#0A0A0A"/>
  <text x="72" y="92" class="title">The stage model</text>
  <text x="72" y="142" class="subtitle">Account maturity changes the production mix while proof, cluster, and review controls stay constant.</text>
  <line x1="72" y1="190" x2="1368" y2="190" stroke="#2A2E36"/>
<rect x="72" y="245" width="360" height="430" rx="10" fill="rgba(52,211,153,.09)" stroke="#34D399" stroke-opacity=".62"/>
      <text x="98" y="284" class="label mono" fill="#34D399">STAGE 01</text>
      <text x="98" y="337" class="stat">Start</text><circle cx="104" cy="389" r="5" fill="#34D399"/><text x="122" y="395" class="body">Build the source registry</text><circle cx="104" cy="451" r="5" fill="#34D399"/><text x="122" y="457" class="body">Publish original work now</text><circle cx="104" cy="513" r="5" fill="#34D399"/><text x="122" y="519" class="body">Record rights and evidence</text><circle cx="104" cy="575" r="5" fill="#34D399"/><text x="122" y="581" class="body">Create the first baseline</text><line x1="444" y1="460" x2="496" y2="460" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="245" width="360" height="430" rx="10" fill="rgba(245,197,24,.09)" stroke="#F5C518" stroke-opacity=".62"/>
      <text x="536" y="284" class="label mono" fill="#F5C518">STAGE 02</text>
      <text x="536" y="337" class="stat">Momentum</text><circle cx="542" cy="389" r="5" fill="#F5C518"/><text x="560" y="395" class="body">Deepen repeatable theses</text><circle cx="542" cy="451" r="5" fill="#F5C518"/><text x="560" y="457" class="body">Test one variable at a time</text><circle cx="542" cy="513" r="5" fill="#F5C518"/><text x="560" y="519" class="body">Formalize daily review</text><circle cx="542" cy="575" r="5" fill="#F5C518"/><text x="560" y="581" class="body">Grow qualified reach</text><line x1="882" y1="460" x2="934" y2="460" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="948" y="245" width="360" height="430" rx="10" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".62"/>
      <text x="974" y="284" class="label mono" fill="#A855F7">STAGE 03</text>
      <text x="974" y="337" class="stat">Scale</text><circle cx="980" cy="389" r="5" fill="#A855F7"/><text x="998" y="395" class="body">Run an original value engine</text><circle cx="980" cy="451" r="5" fill="#A855F7"/><text x="998" y="457" class="body">Extend only after change</text><circle cx="980" cy="513" r="5" fill="#A855F7"/><text x="998" y="519" class="body">Use versioned profiles</text><circle cx="980" cy="575" r="5" fill="#A855F7"/><text x="998" y="581" class="body">Handoff evidence, not copy</text><text x="72" y="738" class="label mono" fill="#22D3EE">PROGRESSION REQUIRES ALL FIVE GATES</text><g><rect x="72" y="770" width="232" height="38" rx="19" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".5"/><text x="188" y="795" class="tiny" text-anchor="middle" fill="#A855F7">Evidence depth</text></g><g><rect x="330" y="770" width="232" height="38" rx="19" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".5"/><text x="446" y="795" class="tiny" text-anchor="middle" fill="#A855F7">Original quality</text></g><g><rect x="588" y="770" width="232" height="38" rx="19" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".5"/><text x="704" y="795" class="tiny" text-anchor="middle" fill="#A855F7">Trust integrity</text></g><g><rect x="846" y="770" width="232" height="38" rx="19" fill="rgba(168,85,247,.09)" stroke="#A855F7" stroke-opacity=".5"/><text x="962" y="795" class="tiny" text-anchor="middle" fill="#A855F7">Operator capacity</text></g><g><rect x="1104" y="770" width="232" height="38" rx="19" fill="rgba(34,211,238,.09)" stroke="#22D3EE" stroke-opacity=".5"/><text x="1220" y="795" class="tiny" text-anchor="middle" fill="#22D3EE">Data completeness</text></g><rect x="72" y="836" width="1296" height="55" rx="7" fill="#111318" stroke="#2A2E36"/><text x="720" y="871" class="body" text-anchor="middle">Follower count alone never proves readiness.</text></svg>
